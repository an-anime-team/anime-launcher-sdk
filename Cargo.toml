[package]
name = "anime-launcher-sdk"
version = "1.37.0"
authors = ["Nikita Podvirnyi <krypt0nn@vk.com>"]
license = "GPL-3.0"
readme = "README.md"
repository = "https://github.com/an-anime-team/anime-launcher-sdk"
edition = "2021"
publish = false

[dependencies.anime-game-core]
git = "https://github.com/an-anime-team/anime-game-core"
tag = "1.40.0-sophon-tools-gh-mirror"

# path = "../anime-game-core" # ! for dev purposes only

[dependencies]
anyhow = { version = "1.0", features = ["backtrace"] }
tracing = "0.1"

serde = { version = "1.0", features = ["derive"], optional = true }
serde_json = { version = "1.0", optional = true }

enum-ordinalize = { version = "4.3", optional = true }

wincompatlib = { version = "0.7.7", default-features = false, features = ["dxvk"], optional = true }
md-5 = { version = "0.10", features = ["asm"], optional = true }
zip = { version = "3.0", optional = true }

[features]
genshin = []
zzz = []
star-rail = []
honkai = []

# star-rail-patch = [
#     "anime-game-core/patch-jadeite",
#     "anime-game-core/patch-mfc140"
# ]

# Common features
states = []
config = ["dep:serde", "dep:serde_json", "dep:enum-ordinalize"]
components = ["dep:wincompatlib"]
game = ["components", "config"]
sandbox = []
sessions = []

# Genshin-specific features
environment-emulation = ["dep:zip"]
fps-unlocker = ["dep:md-5"]

all = [
    "states",
    "config",
    "components",
    "game",
    "sandbox",
    "sessions",
    "environment-emulation",
    "fps-unlocker"
]
